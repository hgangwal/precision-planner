# Render Blueprint: hosts the dashboard as a free web service.
# Render rebuilds on every push to main, but only after CI passes.
# Free instances sleep after ~15 idle minutes; the next visit wakes them in about a minute.
services:
  - type: web
    name: precision-planner
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      # Gradio reads these: listen on all interfaces, on the port Render routes to.
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0
      - key: GRADIO_SERVER_PORT
        value: "10000"
