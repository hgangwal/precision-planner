# Deploys to Hugging Face Spaces: every push to main is mirrored to the Space's git repo.
# Needs a repo secret HF_TOKEN (a Hugging Face write token) and a repo variable HF_SPACE
# (e.g. "your-hf-username/precision-planner"). Skipped while HF_SPACE is unset: creating
# Gradio Spaces now needs HF PRO or a ZeroGPU-eligible account, so Render is the default host.
name: sync-to-hf

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret is not set"; exit 1; }
          test -n "$HF_SPACE" || { echo "HF_SPACE variable is not set"; exit 1; }
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
